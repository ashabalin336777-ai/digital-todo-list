<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список задач</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="card">
      <header class="header">
        <h1>Список задач</h1>
        <p id="counter" class="counter" aria-live="polite">осталось 0 из 0</p>
      </header>

      <form id="form" class="form">
        <label class="visually-hidden" for="task-input">Новая задача</label>
        <input
          id="task-input"
          type="text"
          name="task"
          placeholder="Новая задача"
          autocomplete="off"
          maxlength="300"
        >
        <button type="submit">Добавить</button>
      </form>

      <p id="empty" class="empty">Задач пока нет</p>
      <ul id="list" class="list"></ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
